<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぐーちゃんカメラ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="camera-wrap">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <img
      id="frame"
      src="guchan.png"
      alt="ぐーちゃん">

  </div>

  ＜button id="capture"＞ 　
  撮影する 
  ＜/button＞ 
  ＜a id="download" download="guchan-photo.png"＞ 　
  保存する 
  ＜/a＞

  ＜script src="app.js"＞＜/script＞

</body>

</html>
