<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぐーちゃんカメラ</title>
<style>
  body {
    margin: 0;
    background: #fff;
    text-align: center;
    font-family: sans-serif;
  }
  h1 {
    font-size: 20px;
    margin: 16px 0;
  }
  .camera-wrap {
    position: relative;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: #000;
    padding-top: 177.78%; /* 9:16 縦長比率をpaddingで確保（aspect-ratio非対応端末向け） */
    overflow: hidden;
  }
  #video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    z-index: 1;
    transform: scaleX(-1);
  }
  #frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  #canvas {
    display: none;
  }
  .btn {
    display: inline-block;
    margin: 16px 8px;
    padding: 12px 24px;
    font-size: 16px;
    background: #ff6f3c;
    color: #fff;
    border: none;
    border-radius: 8px;
    text-decoration: none;
  }
  #status {
    color: #c00;
    font-size: 14px;
    margin: 8px;
    white-space: pre-wrap;
  }
  #result {
    max-width: 500px;
    margin: 0 auto;
  }
  #result img {
    width: 100%;
    display: block;
  }
</style>
</head>
<body>

<h1>ぐーちゃんと記念撮影📸</h1>

<div id="status"></div>

<div>
  <button class="btn" id="startBtn">① カメラを起動する</button>
</div>

<div class="camera-wrap">
  <video id="video" autoplay playsinline muted webkit-playsinline="true" x5-playsinline="true"></video>
  <img id="frame" src="guchan.png" alt="ぐーちゃん">
</div>

<div>
  <button class="btn" id="captureBtn">② 撮影する</button>
</div>

<canvas id="canvas"></canvas>

<div id="result"></div>

<script>
  var statusEl = document.getElementById("status");

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  var video = document.getElementById("video");
  var startBtn = document.getElementById("startBtn");

  function startCamera(constraints) {
    return navigator.mediaDevices.getUserMedia(constraints);
  }

  function attachStream(stream, label) {
    // iOS Safariはこれらのプロパティを「属性」だけでなく
    // JavaScriptの「プロパティ」としても明示的に設定しないと
    // 映像が描画されないことがあるため、念のため全て設定する
    video.muted = true;
    video.playsInline = true;
    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    if ("srcObject" in video) {
      video.srcObject = stream;
    } else {
      // 非常に古いSafari向けフォールバック
      video.src = window.URL.createObjectURL(stream);
    }

    // 一部端末はautoplay属性だけでは再生されないため明示的にplay()を呼ぶ
    var playPromise = video.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(function (playErr) {
        log("再生開始に失敗: " + playErr.name + " " + playErr.message + "\n下の映像エリアを一度タップしてみてください。");
      });
    }

    video.addEventListener("loadedmetadata", function () {
      log(label + "（映像サイズ: " + video.videoWidth + "x" + video.videoHeight + "）");
    });

    // 映像エリアをタップしたら再生を試みる（iOSの自動再生ブロック対策）
    video.addEventListener("click", function () {
      video.play();
    });
  }

  function requestCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      log("このブラウザはカメラに対応していません。SafariまたはChromeで直接このページを開いてください（LINEやXのアプリ内ブラウザでは動作しないことがあります）。");
      return;
    }

    log("カメラ許可のポップアップが画面上部に出ていないか確認してください...");

    startCamera({ video: { facingMode: { exact: "user" } }, audio: false })
      .then(function (stream) {
        attachStream(stream, "カメラ起動成功（インカメラ）");
      })
      .catch(function (err) {
        log("インカメラ指定失敗（" + err.name + "）。通常指定で再試行します...");
        // 端末によっては exact 指定が失敗することがあるので、緩い指定で再試行
        startCamera({ video: { facingMode: "user" }, audio: false })
          .then(function (stream) {
            attachStream(stream, "カメラ起動成功");
          })
          .catch(function (err2) {
            log("カメラエラー: " + err2.name + " " + err2.message + "\n設定アプリ > このブラウザ > カメラ の許可設定もご確認ください。");
          });
      });
  }

  // iOSはユーザーの明示的な操作（タップ）が無いとカメラ許可を求めないことがあるため、
  // ボタンを押したタイミングで初めてカメラをリクエストする
  startBtn.addEventListener("click", requestCamera);

  var captureBtn = document.getElementById("captureBtn");
  var canvas = document.getElementById("canvas");
  var frameImg = document.getElementById("frame");
  var resultDiv = document.getElementById("result");

  captureBtn.addEventListener("click", function () {
    var w = 1080;
    var h = 1920;

    canvas.width = w;
    canvas.height = h;

    var ctx = canvas.getContext("2d");

    if (video.videoWidth === 0) {
      log("まだカメラ映像が準備できていません。数秒待って再度押してください。");
      return;
    }

    // video is mirrored on screen (scaleX(-1)) for a natural selfie feel,
    // so mirror it on the canvas too, matching what the user sees.
    ctx.save();
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, w, h);
    ctx.restore();

    ctx.drawImage(frameImg, 0, 0, w, h);

    var dataUrl = canvas.toDataURL("image/png");

    resultDiv.innerHTML =
      '<img src="' + dataUrl + '">' +
      '<div><a class="btn" download="guchan-photo.png" href="' + dataUrl + '">保存する</a></div>';

    log("撮影しました！下の画像を保存してください。");
  });
</script>

</body>
</html>
